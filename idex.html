<body>
    <script>
        function temp (celsius ){
          return celsius *9/5 +32;
        }
        console.log(temp(25) + " Fahrenheit");
        
        function temp2 (fahrenheit){
          return (fahrenheit -32) *5/9;
        }
        console.log(temp2(86) + " Celsius");


        function length(mile, km){
            console.log(mile*1.6 + "km");
            console.log(mile*5280+ "ft");
            console.log(km*3281 + "ft");
            console.log(km/1.6 + "miles");
            
           
        }
        length(50,5);
    </script>
</body>
